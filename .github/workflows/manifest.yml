name: Update image manifest

on:
  push:
    branches: [main]
    paths:
      - "image/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate image-manifest.json
        run: python3 build-manifest.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add image-manifest.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update image manifest"
            git push
          fi
