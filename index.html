<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PhonePrice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="title-row">
        <div>
          <h1 id="site-title">PhonePrice</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <button id="lang-btn" class="lang-btn" aria-label="Switch language"></button>
      </div>

      <div class="search-row">
        <input
          type="search"
          id="search-input"
          class="search-input"
          autocomplete="off"
        >
        <button id="refresh-btn" class="refresh-btn" data-i18n="refresh"></button>
      </div>

      <div id="brand-chips" class="chips"></div>

      <div class="toolbar">
        <div class="result-count" id="result-count"></div>
        <select id="sort-select" class="sort-select">
          <option value="featured"></option>
          <option value="price-asc"></option>
          <option value="price-desc"></option>
          <option value="name-asc"></option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="status" class="status" role="status"></div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span id="last-updated"></span>
      <span id="mode-badge" class="mode-badge"></span>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
