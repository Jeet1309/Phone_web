<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <title>PhonePrice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="topbar">
        <button id="menu-btn" class="icon-btn menu-btn" aria-label="Companies" aria-expanded="false">
          <span class="menu-icon" aria-hidden="true">☰</span>
          <span class="menu-label" data-i18n="menu"></span>
        </button>

        <div class="brand-head">
          <h1 id="site-title">PhonePrice</h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>

        <button id="lang-btn" class="lang-btn" aria-label="Switch language"></button>
      </div>

      <div class="search-row">
        <input type="search" id="search-input" class="search-input" autocomplete="off">
        <button id="refresh-btn" class="refresh-btn" data-i18n="refresh"></button>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <span class="result-count" id="result-count"></span>
          <button id="filter-pill" class="filter-pill" hidden></button>
        </div>
        <select id="sort-select" class="sort-select">
          <option value="featured"></option>
          <option value="price-asc"></option>
          <option value="price-desc"></option>
          <option value="name-asc"></option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="status" class="status" role="status"></div>
    <div id="grid" class="grid"></div>
    <div class="load-more-wrap">
      <button id="load-more" class="load-more" data-i18n="loadMore" hidden></button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span id="last-updated"></span>
      <span id="mode-badge" class="mode-badge"></span>
    </div>
  </footer>

  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <span class="drawer-title" data-i18n="chooseCompany"></span>
      <button id="drawer-close" class="drawer-close" aria-label="Close">✕</button>
    </div>
    <div id="brand-list" class="brand-list"></div>
  </aside>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
